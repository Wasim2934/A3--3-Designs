<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="logo">SQUID GAME</div>

        <ul class="nav-links">
          <li><a href="#">About</a></li>
          <li><a class="active" href="#">Watch Now</a></li>
          <li><a href="#">Actors</a></li>
          <li><a href="#">Contact</a></li>
        </ul>

        <div class="menu">☰</div>
      </nav>

      <!-- Hero Content -->
      <div class="content">
        <div class="left-content">
          <h1>
            SQUID <br />
            GAME
          </h1>

          <p>
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang <br />
            Season 1: 9 Episodes
          </p>

          <div class="buttons">
            <button class="play-btn">Play Now</button>
            <button class="trailer-btn">Watch Trailer</button>
          </div>
        </div>

        <div class="right-content">
          <div class="scroll">
            <p>SCROLL</p>
            <div class="line"></div>
          </div>
          <img
            src="https://cdn.pnggallery.com/wp-content/uploads/squid-game-01.png"
            alt=""
          />
          <div class="social-media">
            <img
              src="https://img.magnific.com/premium-psd/twiter-3d-icon_530221-968.jpg?semt=ais_hybrid&w=740&q=80"
              alt=""
            />
            <img
              src="https://png.pngtree.com/element_our/sm/20180630/sm_5b37de3263964.jpg"
              alt=""
            />
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png"
              alt=""
            />
          </div>
        </div>
      </div>

      <!-- Cards Section -->
      <div class="cards">
        <div class="card">
          <img
            class="card-image"
            src="https://i.ytimg.com/vi/te6i5yE3e9Q/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLD17hu5ecSOJcezexfUK6Alm0x8FA"
            alt=""
          />
          <img
            class="card-btn"
            src="https://png.pngtree.com/png-vector/20190420/ourmid/pngtree-vector-play-icon-png-image_966644.jpg"
            alt=""
          />
        </div>

        <div class="card">
          <img
            class="card-image"
            src="https://i.pinimg.com/200x150/89/63/a8/8963a81441ff76c177b2a70548b4a49b.jpg"
            alt=""
          />
          <img
            class="card-btn"
            src="https://png.pngtree.com/png-vector/20190420/ourmid/pngtree-vector-play-icon-png-image_966644.jpg"
            alt=""
          />
        </div>

        <div class="card">
          <img
            class="card-image"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-g89w6ksqBav9tV7txMXBAnmtt4BuuXWKCQeaMZuICYHc7Cfv"
            alt=""
          />
          <img
            class="card-btn"
            src="https://png.pngtree.com/png-vector/20190420/ourmid/pngtree-vector-play-icon-png-image_966644.jpg"
            alt=""
          />
        </div>
      </div>
    </section>
  </body>
</html>
